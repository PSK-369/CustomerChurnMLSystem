version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: ds_interview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ds_candidate
      POSTGRES_PASSWORD: ds_candidate_pw
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_candidate -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: ds_interview_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: ds_interview_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlruns
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow-server:/mlflow

volumes:
  pgdata: